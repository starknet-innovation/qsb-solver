name: Prepared public verification
on:
  push:
    branches: [research/parallel-public-verification]
    paths:
      - 'experiments/generic-sha-vector/ordered_verdicts.py'
      - 'experiments/generic-sha-vector/prepared_verdict_experiment.py'
      - 'experiments/generic-sha-vector/prepare_verdict_fixtures.py'
      - 'experiments/generic-sha-vector/first-verdict-fixture-lock.json'
      - 'experiments/generic-sha-vector/evidence/first-verdict-event.json.gz'
      - 'tests/test_ordered_verdicts.py'
      - 'tests/test_prepared_verdicts.py'
      - '.github/workflows/prepared-public-verification.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Stage frozen public verifier inputs
        run: |
          python3 experiments/generic-sha-vector/prepare_verdict_fixtures.py public-input
          mkdir public-results
          git rev-parse HEAD > public-results/source-commit.txt
      - name: Verify serial and prepared paths without network or GPU
        run: |
          set -eu
          trap 'docker rm -f qsb-prepared-verification >/dev/null 2>&1 || true' EXIT
          timeout 600s docker run --name qsb-prepared-verification --rm \
            --user "$(id -u):$(id -g)" --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 64 --memory 2g --cpus 2 \
            --tmpfs /tmp:rw,nosuid,size=128m \
            -e PYTHONDONTWRITEBYTECODE=1 -e QSB_PUBLIC_VERDICT_FIXTURES=/input \
            -v "$PWD/experiments/generic-sha-vector:/src/experiments/generic-sha-vector:ro" \
            -v "$PWD/public-input:/input:ro" -v "$PWD/public-results:/results:rw" \
            --entrypoint /bin/bash \
            ghcr.io/starknet-innovation/qsb-solver@sha256:86eba696ee50bfd5e7b90eca1d3ed6dfa3f60582779a653eff5e9229b55cbfbf \
            -c 'set -eu
              touch /results/.write-check; rm /results/.write-check
              for arm in serial parallel4; do
                for count in 1 32; do
                  timeout 60s python3 /src/experiments/generic-sha-vector/prepared_verdict_experiment.py "$arm" "$count" "/results/$arm-$count.json"
                done
              done
              timeout 60s python3 /src/experiments/generic-sha-vector/prepared_verdict_experiment.py prepared1 32 /results/prepared1-32.json'
          python3 - <<'PY'
          import json, pathlib
          root=pathlib.Path('public-results')
          rows=[json.loads((root/name).read_text()) for name in (
              'serial-1.json','serial-32.json','parallel4-1.json','parallel4-32.json','prepared1-32.json')]
          if any(row['result'] != {'valid':False} for row in rows):
              raise ValueError('frozen rejection verdict mismatch')
          prepared=[row['preparedDigests'] for row in rows if row['preparedDigests'] is not None]
          if not prepared or any(item != prepared[0] for item in prepared):
              raise ValueError('prepared inputs differed')
          (root/'validation.json').write_text(json.dumps(dict(status='passed',samples=5,
              scope='Native Linux correctness of fixed saved-record verification; not matched timing or full pipeline'),indent=2))
          PY
      - name: Confirm container cleanup
        if: always()
        run: |
          docker rm -f qsb-prepared-verification >/dev/null 2>&1 || true
          test -z "$(docker ps -aq --filter name=^/qsb-prepared-verification$)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: prepared-public-verification
          path: public-results/
          if-no-files-found: warn
