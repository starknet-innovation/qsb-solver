name: Publish attested solver
on:
  push:
    tags: ['v*', 'aws-v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        id: image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          file: worker/Dockerfile
          target: ${{ startsWith(github.ref_name, 'aws-v') && 'aws' || 'runpod' }}
          build-args: CUDA_ARCH=${{ startsWith(github.ref_name, 'aws-v') && '86' || '89' }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/starknet-innovation/qsb-solver:${{ github.ref_name }}
          provenance: mode=max
          sbom: true
      # Scans the exact pushed digest. A failure leaves that tag unattested, with no
      # descriptor or release, so consumers cannot enroll it.
      - name: Scan published digest (fails on critical findings with a fix)
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: python3 scripts/image_scan.py "registry:ghcr.io/starknet-innovation/qsb-solver@$IMAGE_DIGEST" image-scan
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: image-scan
          path: image-scan/
      - name: Attest image
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-name: ghcr.io/starknet-innovation/qsb-solver
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Produce consumer descriptor
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          SOLVER_COMMIT: ${{ github.sha }}
        run: python3 scripts/release_descriptor.py
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-output/solver.json contracts/ranked-v2.json image-scan/image-scan.json --verify-tag --title "$GITHUB_REF_NAME" --notes "Historical solver image, digest and provenance. Independent app CPU verification remains required. No mainnet activation."
