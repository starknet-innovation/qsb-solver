name: Publish reviewed PQB 82c7cba
on:
  workflow_dispatch:
    inputs:
      action:
        description: Copy the verified image and publish v0.2.0
        type: choice
        options: [verify, publish]
        default: verify
concurrency:
  group: pqb-82c7cba-publication
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  publish:
    if: github.ref == 'refs/heads/codex/pqb-publish-82c7cba' && inputs.action == 'publish'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
      actions: read
      attestations: read
    env:
      PUBLICATION_ACTION: ${{ github.event_name == 'workflow_dispatch' && inputs.action || 'verify' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Source checks
        run: python3 -m unittest discover -s tests -v
      - name: Prepare archive transport and signed-bundle attachment tools
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo apt-get update
          sudo apt-get install -y skopeo
          go install oras.land/oras/cmd/oras@v1.3.0
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - name: Authenticate publication transport
        if: env.PUBLICATION_ACTION == 'publish' || env.PUBLICATION_ACTION == 'finalize'
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          printf '%s' "$REGISTRY_TOKEN" | skopeo login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Verify signed build, installed runtime, native receipts and registry publication
        run: python3 scripts/publish_pqb_82c7cba.py "$RUNNER_TEMP/pqb-publish"
