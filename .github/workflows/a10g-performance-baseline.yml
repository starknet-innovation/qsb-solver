name: Build A10G performance baseline
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/a10g-performance-baseline.yml
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build historical baseline for the matched A10G comparison
        shell: bash
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 --target build --build-arg CUDA_ARCH=86 -f worker/Dockerfile -t qsb-baseline-sm86:validation .
          container=$(docker create --entrypoint /bin/true qsb-baseline-sm86:validation)
          trap 'docker rm -f "$container" >/dev/null' EXIT
          mkdir -p artifact/source
          docker cp "$container:/subset" artifact/subset
          docker cp "$container:/src/worker/build/subset/." artifact/source/
          cp worker/prepare_kernels.py worker/Dockerfile artifact/
          cp vendor/challenge/provenance.json artifact/
          docker run --rm --network none --entrypoint nvcc qsb-baseline-sm86:validation --version > artifact/compiler.txt
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path('artifact')
          receipt=dict(status='UNEXECUTED',purpose='matched-performance-baseline-only',
              sourceCommit=os.environ['GITHUB_SHA'],architecture='sm_86',
              flags=['-O3','-arch=sm_86','-DZLAB_TRIM=0','-DZLAB_K2S=0'],
              files={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                     for p in sorted(root.rglob('*')) if p.is_file()})
          (root/'receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: performance-baseline-sm86
          path: artifact/
          retention-days: 14
