name: Build AWS A10G solver
on:
  workflow_dispatch:
  push:
    branches: [ops/aws-batch-worker]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
      - name: Build full pinning and subset worker for A10G
        run: |
          docker build --platform linux/amd64 --target runtime --build-arg CUDA_ARCH=86 -f worker/Dockerfile -t qsb-solver-runtime:sm86 .
          docker build --platform linux/amd64 -f worker/aws/Dockerfile -t qsb-solver-aws:sm86 .
          docker run --rm --network none --read-only --entrypoint python3 qsb-solver-aws:sm86 -c 'import handler,aws_entrypoint,boto3; from pathlib import Path; assert Path("/opt/qsb/pinning").is_file(); assert Path("/opt/qsb/subset").is_file()'
      - name: Export immutable artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir artifact
          git rev-parse HEAD > artifact/source-commit.txt
          cp contracts/ranked-v2.json artifact/
          docker inspect qsb-solver-aws:sm86 > artifact/image.json
          docker save qsb-solver-aws:sm86 | gzip -1 > artifact/image.tar.gz
          (cd artifact && sha256sum image.tar.gz source-commit.txt ranked-v2.json image.json > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qsb-solver-aws-sm86
          path: artifact/
          compression-level: 0
          retention-days: 7
